      all_up: All services up
      some_down: "%{down} of %{known} down"
      unavailable: Status unavailable
      up: Up
      down: Down
      unknown: Unknown
      no_response_time: "–"
    columns:
      service: Service
      description: Description
      status: Status
      response_time: Response time
    hints:
      not_configured: "Service status is not set up yet. Add the Kuma metrics URL and the services list in the plugin settings."
      not_configured_link: Open the settings
      reason: "Why: %{reason}"
    page_title: Service status
    errors:
      line_field_count: "needs %{count} fields separated by |, found %{found}"
      line_name_missing: the name is empty
      line_url_invalid: "%{url} is not a web address (use http:// or https://)"
      line_prefix: "Services, line %{line_number}: %{message}"
      metrics_url_invalid: The Kuma metrics URL must start with http:// or https://
      dashboard_url_invalid: The dashboard link must start with http:// or https://
