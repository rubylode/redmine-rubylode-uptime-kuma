en:
  rubylode_uptime_kuma:
    plugin_name: Rubylode Uptime Kuma
    status_plugin:
      missing_html: "Install %{link} to see this with the other status blocks on one page."
      installed_html: "Rubylode Status is installed, so this block shows on the %{link}."
      status_page: Status page
    status:
      all_up: All services up
      some_down: "%{down} of %{known} down"
      unavailable: Status unavailable
      up: Up
      down: Down
      unknown: Unknown
      no_response_time: "-"
    widget:
      not_set_up: Uptime Kuma is not set up yet
      none_known: Uptime Kuma does not know these services
      services_up:
        one: "%{up} of %{count} service up"
        other: "%{up} of %{count} services up"
      with_unknown: "%{summary}, %{unknown} unknown"
    columns:
      service: Service
      description: Description
      status: Status
      response_time: Response time
    hints:
      not_configured: "Service status is not set up yet. Add the Uptime Kuma address and the services list in the plugin settings."
      not_configured_link: Open the settings
      reason: "Why: %{reason}"
    errors:
      line_field_count: "needs %{count} fields separated by |, found %{found}"
      line_name_missing: the name is empty
      line_url_invalid: "%{url} is not a web address (use http:// or https://)"
      line_prefix: "Services, line %{line_number}: %{message}"
      base_url_invalid: The Uptime Kuma address must start with http:// or https://
      dashboard_url_invalid: The dashboard link must start with http:// or https://
      environment_variable_invalid: The token variable name must start with UPTIME_KUMA_ and use only capital letters, digits and underscores.
      allowed_hosts_invalid: "Allowed hosts must be plain host names, separated by spaces or commas (not: %{hosts})"
      host_not_in_allowed_hosts: "The Uptime Kuma address host %{host} is not in the allowed hosts"
      host_not_allowed: "The token is not sent to %{host}: it is not an allowed host"
      plain_http_refused: The token is not sent over plain http. Use https, or check "Allow plain http" for an internal network.
      kuma_redirect: Kuma redirected the request; redirects are never followed with the token
      number_invalid: "%{field} must be a whole number of at least %{minimum}"
      path_line_prefix: "Paths, line %{line_number}: %{message}"
      column_invalid: A column must be left or right
      path_too_long: "is longer than %{maximum} characters"
      path_must_start_with_slash: "must start with / and be a path, not an address"
      path_no_host: "must not start with //; give a path such as /issues, without a host"
      path_bad_characters: "has characters that cannot be in a path"
      path_too_many: "At most %{maximum} paths can be listed"
      visibility_invalid: Who may see the block must be one of the listed choices
      block_title_blank: The block title cannot be empty
      token_not_set: "The environment variable %{name} is not set"
      token_missing: The Kuma token is not set
      kuma_status: "Kuma answered %{status}"
      kuma_unreachable: "Kuma could not be reached (%{error_class})"
      kuma_did_not_answer: Kuma did not answer
    settings:
      base_url:
        label: Uptime Kuma address
        hint: "The address of your Uptime Kuma, for example https://uptime.example.com. Empty means the block is shown to administrators only, with a hint."
      token_environment_variable:
        label: Token variable
        hint: "The name of the environment variable that holds the API token. The token is never saved here. Set it before Redmine starts. The name must start with UPTIME_KUMA_."
        is_set: "set in the environment"
        is_not_set: "not set in the environment"
      allowed_hosts:
        label: Allowed hosts
        hint: "Hosts that may receive the credentials besides the address above, separated by spaces or commas. Redirects to other hosts are never followed."
      allow_plain_http:
        label: Allow plain http
        hint: "Check this only when the service is on a network you trust. The credentials then travel unencrypted."
      services:
        label: Services
        hint: "One service per line: Name | URL | Description | Kuma monitor name. Lines starting with # are ignored."
        example: |-
          Website | https://www.example.com | The public site | Website homepage
          Billing | https://billing.example.com | Invoices | Billing app health
      dashboard_url:
        label: Dashboard link
        hint: "Where a response time links to, for example https://uptime.example.com/dashboard. Empty means the response time is not a link."
      show_response_time:
        label: Show the response time
      block_title:
        label: Block title
        hint: The heading of the block and the name of the top menu link.
      visibility:
        label: Who may see the block
        logged_in: Everyone who is signed in
        admins: Administrators only
      show_on_heading: Show the block on
      show_on_welcome_page:
        label: Welcome page
        hint: Adds the block to Redmine's home page for the people who may see it.
      welcome_page_column:
        label: Column
        hint: Left or right.
      show_on_my_page:
        label: My page
        hint: "Adds the block to the default My page, for people who have not arranged their own. Everyone can still add it from the block list."
      show_on_project_overview:
        label: Project Overview page
        hint: Adds the block to every project's Overview page.
      project_overview_column:
        label: Column
        hint: Left or right.
      show_on_matching_pages:
        label: Pages matching these paths
        hint: Adds a small version of the block to each page whose path matches one of the paths below.
      matching_page_paths:
        label: Paths
        hint: "One path per line, starting with /. * stands for anything inside one path segment, ** for anything. A query string and a trailing slash are ignored."
      show_in_top_menu:
        label: Show in the top menu
        hint: Adds a link to /status/uptime_kuma to the top menu, for the people who may see the block.
      cache_seconds:
        label: Cache seconds
        hint: Uptime Kuma is asked at most once in this many seconds.
      failure_cache_seconds:
        label: Failure cache seconds
        hint: After a failed answer Uptime Kuma is left alone for this many seconds.
      timeout_seconds:
        label: Timeout seconds
        hint: A request to Uptime Kuma is given up after this many seconds.
      column_left: Left
      column_right: Right
    help:
      heading: How to show the block on other pages
      intro: "The block always follows the permission, cache and title settings above. Pick a place:"
      place: Place
      how: How
      needs_setting: Needs a setting
      answer_yes: "Yes"
      answer_no: "No"
      row_wiki: Wiki pages, news, issue and project descriptions, comments, the welcome text
      row_wiki_how: "Type {{uptime_kuma_status}} or {{uptime_kuma_status(title=Our services)}}. Redmine renders all of these with its text formatting, so the macro works in each."
      row_welcome: The welcome page
      row_welcome_how: Check it under Show the block on, and choose a column.
      row_my_page: My page
      row_my_page_how: "Add the Uptime Kuma status block from the block list on My page, or check My page above for the default layout."
      row_overview: The project Overview page
      row_overview_how: Check it under Show the block on, and choose a column.
      row_paths: Any other page
      row_paths_how: "List its path (for example /issues) under Pages matching these paths. It shows in a compact form under the content."
      row_page: A page of its own
      row_page_how: "Link to /status/uptime_kuma, or check Show in the top menu above."
      row_partial: Themes and other plugins
      row_partial_how: "In a view: render partial: \"rubylode_uptime_kuma/status\". Optional locals: title: \"Our services\", show_title: false, compact: true."
      snippets: Copy and paste
      snippet_macro_title: In a wiki page, news item, description or the welcome text
      snippet_macro_titled: With your own heading
      snippet_partial: In a view of a theme or plugin
  my:
    blocks:
      rubylode_uptime_kuma_status: Uptime Kuma status
      rubylode_service_status: Uptime Kuma status
