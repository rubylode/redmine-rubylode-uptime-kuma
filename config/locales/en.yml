      allowed_hosts_invalid: "Allowed hosts must be plain host names, separated by spaces or commas (not: %{hosts})"
      host_not_in_allowed_hosts: "The metrics URL host %{host} is not in the allowed hosts"
      host_not_allowed: "The token is not sent to %{host}: it is not an allowed host"
      plain_http_refused: "The token is not sent over plain http. Use https, or tick the allow plain http setting for an internal network"
      kuma_redirect: Kuma redirected the request; redirects are never followed with the token
      number_invalid: "%{field} must be a whole number of at least %{minimum}"
      path_line_prefix: "Paths, line %{line_number}: %{message}"
      column_invalid: A column must be left or right
      path_too_long: "is longer than %{maximum} characters"
      path_must_start_with_slash: "must start with / and be a path, not an address"
      path_no_host: "must not start with //; give a path such as /issues, without a host"
      path_bad_characters: "has characters that cannot be in a path"
      path_too_many: "At most %{maximum} paths can be listed"
      visibility_invalid: Who may see the block must be one of the listed choices
      block_title_blank: The block title cannot be empty
      token_not_set: "The environment variable %{name} is not set"
      token_missing: Kuma token is not set
      kuma_status: "Kuma answered %{status}"
      kuma_unreachable: "Kuma could not be reached (%{error_class})"
      kuma_did_not_answer: Kuma did not answer
    settings:
      metrics_url: Kuma metrics URL
      metrics_url_hint: "For example https://uptime.example.com/metrics. Empty means the block is not shown to anyone but administrators, who get a hint."
      token_environment_variable: Name of the token environment variable
      token_environment_variable_hint: "The token itself is never saved here: put it in this environment variable before Redmine starts. The name must start with UPTIME_KUMA_. It is used as the password of the metrics request."
      token_is_set: "set in the environment"
      token_is_not_set: "not set in the environment"
      allowed_hosts: Allowed hosts
      allowed_hosts_hint: "Hosts the token may be sent to, separated by spaces or commas. Empty means only the host of the metrics URL. Redirects to any other host are never followed."
      allow_plain_http: Allow plain http (internal network)
      allow_plain_http_hint: "The token is only sent over https, or to this machine (localhost). Tick this only when Kuma is reached over a network you trust."
      services: Services
      services_hint: "One service per line: Name | URL | Description | Kuma monitor name. The description may be empty. Lines starting with # are ignored."
      services_example: |-
        Website | https://www.example.com | The public site | Website homepage
        Billing | https://billing.example.com | Invoices | Billing app health
      dashboard_url: Dashboard link
      dashboard_url_hint: "Where a response time links to, for example https://uptime.example.com/dashboard. Optional."
      cache_seconds: Cache seconds
      cache_seconds_hint: "Kuma is asked at most once in this many seconds."
      failure_cache_seconds: Failure cache seconds
      failure_cache_seconds_hint: "After a failed answer Kuma is left alone for this long."
      timeout_seconds: Timeout seconds
      show_response_time: Show the response time
      block_title: Block title
      show_on_heading: Show the block on
      show_on_welcome_page: The welcome page (Home)
      show_on_my_page: My page
      show_on_my_page_hint: "Adds the block to the default My page, for people who have not arranged their own. Everyone else adds it from the block list on My page."
      show_on_project_overview: The project Overview page
      show_on_matching_pages: "Pages whose path is listed here"
      matching_page_paths: Paths
      matching_page_paths_hint: "One path per line, for example /issues or /projects/*/issues. * stands for anything inside one path segment, ** for anything including slashes. Query strings and a trailing slash are ignored. The block appears in a compact form under the page content. Sign-in, account, Administration and settings pages are never matched by a wildcard: list /admin/* or /settings explicitly if you really want it there."
      show_in_top_menu: Add a Service status link to the top menu
      show_in_top_menu_hint: "Links to the standalone page /service_status for the people allowed to see it."
      column_label: Column
      column_left: Left
      column_right: Right
      visibility: Who may see the block
      visibility_logged_in: Everyone who is signed in
      visibility_admins: Administrators only
    help:
      heading: How to show the block on other pages
      intro: "The block always follows the permission, cache and title settings above. Pick a place:"
      place: Place
      how: How
      needs_setting: Needs a setting
      answer_yes: "Yes"
      answer_no: "No"
      row_wiki: "Wiki page, news, issue or project description, comment, or the welcome text (Administration, Settings, General)"
      row_wiki_how: "Type {{service_status}} or {{service_status(title=Our services)}}. Redmine renders all of these with its text formatting, so the macro works in each."
      row_welcome: The welcome page
      row_welcome_how: Tick it under Show the block on, and choose a column.
      row_my_page: My page
      row_my_page_how: "Add the Service status block from the block list on My page, or tick My page above for the default layout."
      row_overview: The project Overview page
      row_overview_how: Tick it under Show the block on, and choose a column.
      row_paths: Any other page
      row_paths_how: "List its path (for example /issues) under Pages whose path is listed here. It shows in a compact form under the content."
      row_page: A page of its own
      row_page_how: "Link to /service_status, or tick the top menu link above."
      row_partial: Themes and other plugins
      row_partial_how: "In a view: render partial: \"rubylode_uptime_kuma/service_status\". Optional locals: title: \"Our services\", show_title: false, compact: true."
